# Apache reverse proxy for MediaMTX WebRTC (WHEP) — PLAIN HTTP (port 80).
#
# Use this when you don't yet have a TLS cert. It proxies :80 straight to
# MediaMTX's WHEP endpoint on :8889.
#
# ⚠️  Enable EITHER this file OR play.jrta.online.conf (the TLS one) — NOT
#     both. Two vhosts with the same ServerName on *:80 conflict.
#
# ⚠️  Mixed content: if your player page loads over https, the browser will
#     BLOCK calls to this http WHEP endpoint. This is fine for curl testing
#     and http-only player pages; for production behind https, switch to the
#     TLS vhost (play.jrta.online.conf).
#
# ── IMPORTANT: this proxies SIGNALING ONLY ───────────────────────────────
# WHEP negotiates over HTTP; the audio/video flows over UDP (ICE), which does
# NOT pass through Apache. For playback you ALSO need, MediaMTX-side:
#   * firewall: open the WebRTC UDP port(s) (default 8189/udp)
#   * mediamtx.yml:
#       webrtcAdditionalHosts: [play.jrta.online]
#       webrtcLocalUDPAddress: :8189   # (default)
# ─────────────────────────────────────────────────────────────────────────
#
# Required modules:  a2enmod proxy proxy_http headers

<VirtualHost *:80>
    ServerName play.jrta.online

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On

    RequestHeader set X-Forwarded-Proto "http"

    # MediaMTX issues CORS itself (webrtcAllowOrigin); we only forward.
    # Bearer token (Authorization header) is forwarded by mod_proxy as-is.
    ProxyPass        / http://127.0.0.1:8889/ retry=0 timeout=30 keepalive=On
    ProxyPassReverse / http://127.0.0.1:8889/

    ErrorLog  ${APACHE_LOG_DIR}/play-error.log
    CustomLog ${APACHE_LOG_DIR}/play-access.log combined
</VirtualHost>
