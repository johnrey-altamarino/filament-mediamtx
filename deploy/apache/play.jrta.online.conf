# Apache reverse proxy for MediaMTX WebRTC (WHEP) signaling — TLS edition.
#
# Dedicated subdomain that fronts MediaMTX's WHEP HTTP endpoint on :8889.
# The Laravel panel + JWKS keep serving on studio.jrta.online — this vhost
# is media only.
#
# ── Cloudflare ───────────────────────────────────────────────────────────
# WebRTC CANNOT be proxied by Cloudflare. Set the `play` DNS record to
# "DNS only" (grey cloud). Because it's not proxied, do NOT use a Cloudflare
# Origin Certificate — use Let's Encrypt (certbot) on the origin instead.
#
# ── IMPORTANT: this proxies SIGNALING ONLY ───────────────────────────────
# WHEP negotiates the session over HTTPS (POST offer / PATCH ICE / DELETE).
# The actual audio/video flows over UDP (ICE), which does NOT pass through
# Apache and is encrypted by WebRTC's own DTLS-SRTP (TLS termination here is
# irrelevant to the media). For playback you ALSO need, MediaMTX-side:
#   * firewall: open the WebRTC UDP port(s) (default 8189/udp) to the world
#   * mediamtx.yml:
#       webrtcAdditionalHosts: [play.jrta.online]
#       webrtcLocalUDPAddress: :8189   # (default)
# Without that, signaling succeeds but the stream never connects.
# ─────────────────────────────────────────────────────────────────────────
#
# Required modules:  a2enmod proxy proxy_http headers ssl rewrite
# Cert:              certbot --apache -d play.jrta.online  (see steps below)

<VirtualHost *:80>
    ServerName play.jrta.online

    # Allow ACME HTTP-01 challenges through; redirect everything else to https.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [L,R=301]

    ErrorLog  ${APACHE_LOG_DIR}/play-error.log
    CustomLog ${APACHE_LOG_DIR}/play-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName play.jrta.online

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/play.jrta.online/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/play.jrta.online/privkey.pem
    # Optional hardening (Mozilla intermediate):
    # SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    # SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:...
    # SSLHonorCipherOrder     off

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On

    # TLS terminates here; MediaMTX is plain http on loopback.
    # Tell it the original scheme so any absolute URLs it builds are https.
    RequestHeader set X-Forwarded-Proto "https"

    # MediaMTX issues CORS itself (webrtcAllowOrigin); we only forward.
    # Bearer token (Authorization header) is forwarded by mod_proxy as-is.
    ProxyPass        / http://127.0.0.1:8889/ retry=0 timeout=30 keepalive=On
    ProxyPassReverse / http://127.0.0.1:8889/

    ErrorLog  ${APACHE_LOG_DIR}/play-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/play-ssl-access.log combined
</VirtualHost>
