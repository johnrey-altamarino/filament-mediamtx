<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MediaMTX WebRTC Player</title>
<script defer src="./reader.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
  }
  #status {
    position: absolute;
    color: #ccc;
    font-family: sans-serif;
    font-size: 0.9rem;
    pointer-events: none;
  }
</style>
</head>
<body>

<video id="myvideo" autoplay playsinline muted controls disablepictureinpicture></video>
<div id="status"></div>

<script>
const WHEP_BASE_URL = "https://stream.jrta.online";

let reader = null;
let token = null;
let retryDelay = 2000;
let refreshTimer = null;

const stream = new URLSearchParams(window.location.search).get("stream");

if (!stream) {
  document.body.innerHTML = '<p style="color:#fff;font-family:sans-serif;text-align:center;margin-top:2rem">Missing required <code>?stream=</code> parameter.</p>';
  throw new Error("Missing stream parameter");
}

const whepUrl = `${WHEP_BASE_URL}/${stream}/whep`;
const statusEl = document.getElementById("status");
const videoEl = document.getElementById("myvideo");

function setStatus(msg) {
  statusEl.textContent = msg;
}

async function fetchToken() {
  const res = await fetch("/api/read", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Accept": "application/json",
    },
    credentials: "include",
    body: JSON.stringify({ path: stream }),
  });

  if (!res.ok) throw new Error(`Token request denied (${res.status})`);

  const data = await res.json();
  if (!data.token) throw new Error("JWT not received");

  token = data.token;

  // Schedule a silent refresh 10s before the token expires
  if (refreshTimer) clearTimeout(refreshTimer);
  if (data.expires_at) {
    const msUntilRefresh = data.expires_at * 1000 - Date.now() - 10_000;
    if (msUntilRefresh > 0) {
      refreshTimer = setTimeout(async () => {
        try { await fetchToken(); } catch (err) { console.error("Token refresh failed:", err); }
      }, msUntilRefresh);
    }
  }
}

async function initPlayer() {
  setStatus("Connecting…");

  try {
    await fetchToken();
  } catch (err) {
    setStatus(`Error: ${err.message}`);
    return;
  }

  if (reader) { reader.close(); reader = null; }

  reader = new MediaMTXWebRTCReader({
    url: whepUrl,
    token,
    onError: (err) => {
      console.error("WebRTC error:", err);
      setStatus("Reconnecting…");
      if (reader) { reader.close(); reader = null; }
      setTimeout(() => {
        retryDelay = Math.min(retryDelay * 2, 30_000);
        initPlayer();
      }, retryDelay);
    },
    onTrack: (evt) => {
      videoEl.srcObject = evt.streams[0];
      setStatus("");
      retryDelay = 2000;
    },
  });
}

window.addEventListener("load", initPlayer);
window.addEventListener("beforeunload", () => {
  if (refreshTimer) clearTimeout(refreshTimer);
  if (reader) reader.close();
});
</script>

</body>
</html>
