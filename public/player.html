<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://stream.jrta.online">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebRTC Player</title>
<script defer src="./reader.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
  }
  #status {
    position: absolute;
    color: #ccc;
    font-family: sans-serif;
    font-size: 0.9rem;
    pointer-events: none;
  }
  #loader {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #loader.hidden { display: none; }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(255,255,255,0.12);
    border-top-color: rgba(255,255,255,0.55);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<video id="myvideo" autoplay playsinline muted disablepictureinpicture></video>
<div id="loader"><div class="spinner"></div></div>
<div id="status"></div>

<script>
const WHEP_BASE_URL = "https://stream.jrta.online";

let reader = null;
let token = null;
let retryDelay = 2000;
let refreshTimer = null;

const stream = new URLSearchParams(window.location.search).get("stream");

if (!stream) {
  document.body.innerHTML = '<p style="color:#fff;font-family:sans-serif;text-align:center;margin-top:2rem">Missing required <code>?stream=</code> parameter.</p>';
  throw new Error("Missing stream parameter");
}

const whepUrl = `${WHEP_BASE_URL}/${stream}/whep`;
const statusEl = document.getElementById("status");
const videoEl = document.getElementById("myvideo");
const loaderEl = document.getElementById("loader");

function setStatus(msg) { statusEl.textContent = msg; }
function showLoader(v) { loaderEl.classList.toggle("hidden", !v); }

videoEl.addEventListener("playing", () => showLoader(false));
videoEl.addEventListener("waiting", () => showLoader(true));

async function fetchToken() {
  const res = await fetch("https://platform.jrta.online/api/read", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Accept": "application/json",
    },
    credentials: "include",
    body: JSON.stringify({ path: stream }),
  });

  if (!res.ok) throw new Error(`Token request denied (${res.status})`);

  const data = await res.json();
  if (!data.token) throw new Error("JWT not received");

  token = data.token;

  if (refreshTimer) clearTimeout(refreshTimer);
  if (data.expires_at) {
    const msUntilRefresh = data.expires_at * 1000 - Date.now() - 10_000;
    if (msUntilRefresh > 0) {
      refreshTimer = setTimeout(async () => {
        try { tokenPromise = fetchToken(); await tokenPromise; } catch (err) { console.error("Token refresh failed:", err); }
      }, msUntilRefresh);
    }
  }
}

// Kick off token fetch immediately — runs in parallel with reader.js codec probing
let tokenPromise = fetchToken();

async function initPlayer() {
  setStatus("Connecting…");
  showLoader(true);

  try {
    await tokenPromise;
  } catch (err) {
    setStatus(`Error: ${err.message}`);
    showLoader(false);
    return;
  }

  if (reader) { reader.close(); reader = null; }

  reader = new MediaMTXWebRTCReader({
    url: whepUrl,
    token,
    onError: (err) => {
      console.error("WebRTC error:", err);
      setStatus("Reconnecting…");
      showLoader(true);
      if (reader) { reader.close(); reader = null; }
      setTimeout(() => {
        retryDelay = Math.min(retryDelay * 2, 30_000);
        tokenPromise = fetchToken();
        initPlayer();
      }, retryDelay);
    },
    onTrack: (evt) => {
      videoEl.srcObject = evt.streams[0];
      setStatus("");
      retryDelay = 2000;
    },
  });
}

// defer scripts execute before DOMContentLoaded, so MediaMTXWebRTCReader is ready here
window.addEventListener("DOMContentLoaded", initPlayer);
window.addEventListener("beforeunload", () => {
  if (refreshTimer) clearTimeout(refreshTimer);
  if (reader) reader.close();
});
</script>

</body>
</html>
